          if (msg === 'Script error.' || msg === 'Script error' || msg.toLowerCase().includes('script error') || !filename || filename.includes('clarity.ms') || filename.includes('disqus.com') || filename.includes('count.js')) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            const reasonStr = String(event.reason);
            if (reasonStr.includes('Script error') || reasonStr.includes('clarity') || reasonStr.includes('disqus')) {
              if (event.preventDefault) event.preventDefault();
            }
          }
        });
